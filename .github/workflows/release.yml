name: Release

# A pushed tag `vX.Y.Z` (made by `make release`) publishes to PyPI; a manual run
# (`make release-test`) publishes a `.devN` build of the chosen ref to TestPyPI.
# Both use trusted publishing (OIDC): no API token is stored anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          v=$(python3 scripts/release.py --print-version)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $v"
            exit 1
          fi
      - name: Unique dev version for TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: sed -i -E 's/^version = "([^"]+)"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
      - run: uv build
      - run: uvx twine check dist/*
      # The build config alone is no guarantee (0.5.0 shipped the Studio), so
      # inspect the artifact itself.
      - run: python3 scripts/release.py --check-wheel dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anchorsfactory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anchorsfactory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release (CHANGELOG section as notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py --notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/*
