name: Release

# A pushed tag `vX.Y.Z` (made by `make release`) publishes to PyPI by trusted
# publishing (OIDC): no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the version in pyproject.toml
        run: |
          v=$(python3 scripts/release.py --print-version)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $v"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      # The build config alone is no guarantee (0.5.0 shipped the Studio), so
      # inspect the artifact itself.
      - run: python3 scripts/release.py --check-wheel dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anchorsfactory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release (CHANGELOG section as notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py --notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/*
